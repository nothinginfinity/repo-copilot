name: FLRS Email Routing credential tests
on:
  pull_request:
    paths:
      - 'apps/afo-cf-universal-mcp/**'
      - '.github/workflows/flrs-email-credential-tests.yml'
  push:
    branches:
      - 'chatgpt/flrs-email-routing-credential-selection-20261028'
    paths:
      - 'apps/afo-cf-universal-mcp/**'
      - '.github/workflows/flrs-email-credential-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/afo-cf-universal-mcp/credential-routing.test.mjs
      - run: node --test apps/afo-cf-universal-mcp/credential-routing.test.mjs
